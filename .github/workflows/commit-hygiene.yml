name: commit-hygiene

# Fails a pull request when any of its commits carries co-author trailers or AI/tool attribution.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  no-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --format='%H%n%B%n----' "$BASE..$HEAD" | grep -iE '^(co-authored-by)|generated (with|by) |noreply@anthropic\.com|🤖' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commit messages must not contain co-author trailers or AI/tool attribution (see AGENTS.md)."
            echo "$bad"
            exit 1
          fi
          echo "OK: no attribution trailers."
      - name: Check PR title and description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -qiE 'co-authored-by|generated (with|by) |noreply@anthropic\.com|🤖'; then
            echo "::error::PR title/description must not contain AI/tool attribution (see AGENTS.md)."
            exit 1
          fi
